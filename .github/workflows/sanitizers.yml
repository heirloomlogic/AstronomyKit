name: Sanitizers

on:
  pull_request:
    paths:
      - ".github/lsan-suppressions.txt"
      - ".github/workflows/sanitizers.yml"
      - "Package.swift"
      - "Scripts/test-lsan-suppressions.sh"
      - "Scripts/test-test-isolation-wrapper.sh"
      - "Scripts/test-with-isolated-timed-suites.sh"
      - "Scripts/validate-test-isolation.py"
      - "Sources/AstronomyKit/**"
      - "Tests/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-latest
    # DE-backed trajectories still made test progress at the 120-minute cutoff
    # after the evaluation-scoped reuse fix (run 38381655135). Preserve the full
    # workload, isolation and per-test guards with a finite three-hour ceiling.
    timeout-minutes: 180
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Test (Address Sanitizer)
        # LeakSanitizer runs inside ASan and failed this job on every scheduled
        # run: 368 bytes in 6 allocations, all inside libXCTest.so, after all
        # 579 tests passed. The suppressions file documents that harness leak.
        #
        # LSAN_OPTIONS, not ASAN_OPTIONS. A `leak:` entry is a LeakSanitizer
        # suppression; ASan's own parser accepts only interceptor_name,
        # interceptor_via_fun, interceptor_via_lib and odr_violation, and
        # rejects the file outright with "failed to parse suppressions".
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
        run: |
          Scripts/test-lsan-suppressions.sh
          Scripts/test-test-isolation-wrapper.sh
          Scripts/test-with-isolated-timed-suites.sh --sanitize=address
