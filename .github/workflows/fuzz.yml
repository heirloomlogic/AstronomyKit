name: Native safety

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Fuzzing/**"
      - "Package.swift"
      - "Sources/AstronomyKit/**"
      - "Tests/AstronomyKitTests/NativeSafetyTests.swift"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Verify historical corpus
        run: python3 Fuzzing/make_corpus.py --check

      - name: Replay corpus and generated properties in native Swift
        run: swift test --filter NativeSafetyTests
