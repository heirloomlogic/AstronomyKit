name: Tests

# PRs only. A `push: branches: [main]` trigger here re-ran every job against a
# commit the PR had already tested green — a flat 2x for no new signal. The
# trade: `main` has no branch protection, so nothing re-tests a merge commit;
# a semantic conflict between two branches that each passed alone now surfaces
# on the next PR rather than immediately. Restore the push trigger if one slips
# through.
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated time table
        run: python3 Scripts/generate-time-table.py --check

      - name: Verify generated nutation table
        run: python3 Scripts/generate-nutation-table.py --check

      - name: Verify generated planet tables
        run: python3 Scripts/generate-planet-tables.py --check

      - name: Verify generated Moon tables
        run: python3 Scripts/generate-moon-tables.py --check

      - name: Verify DE441 Moon assessment tooling
        run: |
          python3 -m unittest Scripts/test_assess_moon_de441.py Scripts/test_qualify_moon_de441.py Scripts/test_generate_moon_de441.py -v
          python3 Scripts/generate-moon-de441.py --check

      - name: Verify generated Pluto tables
        run: python3 Scripts/generate-pluto-tables.py --check

      - name: Verify generated Jupiter moon series
        run: python3 Scripts/generate-jupiter-moon-series.py --check

      - name: Verify independent reference fixtures
        run: |
          python3 -m unittest Scripts/reference-data/test_build_fixtures.py -v
          python3 Scripts/reference-data/build-fixtures.py --check

      - name: Verify native solar numerical tools
        run: |
          python3 -m venv .build/numerics-venv
          .build/numerics-venv/bin/pip install -r Scripts/solar-numerics/requirements.txt
          .build/numerics-venv/bin/python -m unittest discover -s Scripts/solar-numerics -v
          python3 Scripts/solar-numerics/numerics.py --check
          .build/numerics-venv/bin/python Scripts/solar-numerics/certify_light_time.py --check
          .build/numerics-venv/bin/python Scripts/solar-numerics/derive_altitude.py --check
          .build/numerics-venv/bin/python Scripts/solar-numerics/measure.py --recheck --output Scripts/solar-numerics/evidence/macos-arm64-debug.json
          .build/numerics-venv/bin/python Scripts/solar-numerics/measure.py --recheck --output Scripts/solar-numerics/evidence/macos-arm64-release.json

          .build/numerics-venv/bin/python Scripts/solar-numerics/measure_altitude.py --recheck --output Scripts/solar-numerics/evidence/altitude-macos-arm64-debug.json
          .build/numerics-venv/bin/python Scripts/solar-numerics/measure_altitude.py --recheck --output Scripts/solar-numerics/evidence/altitude-macos-arm64-release.json

      - name: Verify work-avoidance paths
        run: |
          sh Scripts/performance/test-vsop-cache.sh
          sh Scripts/performance/test-nutation-cache.sh
          sh Scripts/performance/test-moon-cache.sh

      - name: Test
        run: swift test --no-parallel

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Verify generated planet tables
        run: python3 Scripts/generate-planet-tables.py --check

      - name: Verify generated Moon tables
        run: python3 Scripts/generate-moon-tables.py --check

      - name: Verify DE441 Moon assessment tooling
        run: |
          python3 -m unittest Scripts/test_assess_moon_de441.py Scripts/test_qualify_moon_de441.py Scripts/test_generate_moon_de441.py -v
          python3 Scripts/generate-moon-de441.py --check

      - name: Verify generated Pluto tables
        run: python3 Scripts/generate-pluto-tables.py --check

      - name: Verify generated Jupiter moon series
        run: python3 Scripts/generate-jupiter-moon-series.py --check

      - name: Verify work-avoidance paths
        run: |
          sh Scripts/performance/test-vsop-cache.sh
          sh Scripts/performance/test-nutation-cache.sh
          sh Scripts/performance/test-moon-cache.sh

      - name: Test
        run: swift test --no-parallel

  test-thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Test (Thread Sanitizer)
        # Synchronization.Mutex is not modeled by ThreadSanitizer on Linux, so
        # Mutex-guarded state is falsely reported as racing under contention.
        # The suppressions file documents these known false positives.
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
        run: swift test --no-parallel --sanitize=thread

  test-release-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test (release)
        run: swift test --no-parallel -c release

  test-release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Test (release)
        run: swift test --no-parallel -c release

  # The macOS jobs above exercise the shared source, but the iOS/tvOS/watchOS
  # SDKs compile differently (availability, unavailable APIs). Build the library
  # for each declared Apple platform so a platform-specific break is caught here
  # rather than in a consumer's app. Build-only: running would require booting a
  # simulator, and the behavior is already covered by the macOS test jobs.
  build-apple-platforms:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build (${{ matrix.platform }})
        run: |
          xcodebuild build \
            -scheme AstronomyKit \
            -destination "generic/platform=${{ matrix.platform }}"
