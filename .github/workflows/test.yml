name: Tests

# PRs only. A `push: branches: [main]` trigger here re-ran every job against a
# commit the PR had already tested green — a flat 2x for no new signal. The
# trade: `main` has no branch protection, so nothing re-tests a merge commit;
# a semantic conflict between two branches that each passed alone now surfaces
# on the next PR rather than immediately. Restore the push trigger if one slips
# through.
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frozen evidence Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify generated model and time tables
        run: |
          python3 Scripts/generate-models.py --check
          python3 Scripts/generate-time-table.py --check

      - name: Verify migration foundation
        run: |
          git cat-file -e "cdb533dbe85c76b39a958ca92f9155d8bd55b392^{commit}" || git fetch --no-tags --depth=1 origin cdb533dbe85c76b39a958ca92f9155d8bd55b392
          git cat-file -e "1add73ec6c117e9b6f3d26e745a3487262ff4c75^{commit}" || git fetch --no-tags --depth=1 origin 1add73ec6c117e9b6f3d26e745a3487262ff4c75
          git cat-file -e "fad9e9b5d8e3dd823d1ce1f25c51b80ac23b11ff^{commit}" || git fetch --no-tags --depth=1 origin fad9e9b5d8e3dd823d1ce1f25c51b80ac23b11ff
          Tools/Migration/Oracle/freeze-oracle.py --check
          Scripts/migration/generate-contract-inventory.py --check
          python3 -m unittest Scripts/migration/test_foundation.py -v
          python3 -m unittest Scripts/migration/test_comparison.py -v
          python3 -m unittest Scripts/migration/test_performance.py -v
          python3 -m unittest Scripts/migration/test_performance_candidate.py -v
          python3 -m unittest Scripts/reference-data/test_build_fixtures.py -v
          python3 -m unittest Scripts/reference-data/test_distance_accuracy.py -v
          python3 Scripts/reference-data/distance-accuracy.py check
          python3 -m unittest Scripts/reference-data/test_range_rate_investigation.py -v
          python3 Scripts/reference-data/investigate-range-rate.py --check
          python3 -m unittest Scripts/reference-data/test_outer_planet_diagnostic.py -v
          python3 -m unittest Scripts/reference-data/test_pluto_model_diagnostic.py -v
          python3 Scripts/reference-data/outer-planet-diagnostic.py check
          python3 Scripts/reference-data/pluto-model-diagnostic.py --check
          python3 Scripts/migration/verify_performance_baseline.py
          # Verify the pre-bundle performance archive; it does not qualify the repaired model.
          python3 Scripts/migration/performance_candidate.py --check-archive

      - name: Verify bundled ephemeris integrity
        run: |
          python3 Scripts/ephemeris/generate-lunar-bundle.py --check
          python3 Scripts/ephemeris/verify-pluto.py
          python3 -m unittest Scripts/ephemeris/test_pluto_artifacts.py -v
          python3 -m unittest Scripts/reference-data/test_bundled_public_api.py -v

      - name: Verify polynomial artifacts and analytic evaluator
        run: |
          python3 Scripts/performance/polynomial/embed.py --check
          python3 -m unittest discover -s Scripts/performance/polynomial -p 'test_*.py' -v

      - name: Verify work-avoidance paths
        run: |
          sh Scripts/performance/test-vsop-cache.sh
          sh Scripts/performance/test-nutation-cache.sh
          sh Scripts/performance/test-moon-cache.sh

      - name: Test
        run: swift test --no-parallel

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Verify bundled ephemeris integrity
        run: |
          python3 Scripts/ephemeris/generate-lunar-bundle.py --check
          python3 Scripts/ephemeris/verify-pluto.py
          python3 -m unittest Scripts/ephemeris/test_pluto_artifacts.py -v
          python3 -m unittest Scripts/reference-data/test_bundled_public_api.py -v

      - name: Verify polynomial artifacts and analytic evaluator
        run: |
          python3 Scripts/performance/polynomial/embed.py --check
          python3 -m unittest discover -s Scripts/performance/polynomial -p 'test_*.py' -v

      - name: Verify work-avoidance paths
        run: |
          sh Scripts/performance/test-vsop-cache.sh
          sh Scripts/performance/test-nutation-cache.sh
          sh Scripts/performance/test-moon-cache.sh

      # Exact arithmetic gives the same bounds on every platform, and the
      # measurement needs GCC's libquadmath, so this runs here and not on macOS.
      - name: Verify the solar altitude error budget
        run: |
          python3 Scripts/numerics/solar-altitude/bounds.py --check
          python3 -m unittest discover -s Scripts/numerics/solar-altitude -p 'test_*.py' -v
          python3 Scripts/numerics/solar-altitude/measure.py --check

      - name: Test
        run: swift test --no-parallel

  test-thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Test (Thread Sanitizer)
        # Synchronization.Mutex is not modeled by ThreadSanitizer on Linux, so
        # Mutex-guarded state is falsely reported as racing under contention.
        # The suppressions file documents these known false positives.
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
        run: swift test --no-parallel --sanitize=thread

  test-release-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test (release)
        run: swift test --no-parallel -c release

  test-release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Test (release)
        run: swift test --no-parallel -c release

  # The macOS jobs above exercise the shared source, but the iOS/tvOS/watchOS
  # SDKs compile differently (availability, unavailable APIs). Build the library
  # for each declared Apple platform so a platform-specific break is caught here
  # rather than in a consumer's app. Build-only: running would require booting a
  # simulator, and the behavior is already covered by the macOS test jobs.
  build-apple-platforms:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build (${{ matrix.platform }})
        run: |
          xcodebuild build \
            -scheme AstronomyKit \
            -destination "generic/platform=${{ matrix.platform }}"

  seasonal-reference-replay:
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the reference Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install Swift on Linux
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"
      - name: Install isolated independent reference dependencies
        run: |
          python3 -m pip install --only-binary=:all: --target .context/accuracy-qualification/python-reference pyerfa==2.0.1.5 numpy==2.3.5
      - name: Build isolated public seasonal runner
        run: python3 Scripts/reference-data/build-accuracy-runner.py
      - name: Replay retained seasonal reference experiment offline
        run: |
          python3 -m unittest Scripts/reference-data/test_seasonal_roots.py -v
          python3 Scripts/reference-data/check-seasonal-public-runner.py
          python3 Scripts/reference-data/qualify-seasonal-roots.py check
