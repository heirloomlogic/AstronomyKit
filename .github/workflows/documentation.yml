name: Documentation

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: macos-26
    timeout-minutes: 20
    # Scoped to this job rather than the workflow: the deploy step below pushes
    # the built docs to the gh-pages branch.
    permissions:
      contents: write
    steps:
      # No `persist-credentials: false` here, unlike every other checkout in
      # this repo. This job ends in a push to gh-pages, and stripping the
      # token from .git/config is a change that cannot be proven on a pull
      # request — this workflow only fires on a version tag or a manual
      # dispatch. Leave the credentials alone.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clean docs directory
        run: rm -rf ./docs

      - name: Enable dev tooling
        run: touch .dev-tooling

      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target AstronomyKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path /AstronomyKit \
            --output-path ./docs

      - name: Create .nojekyll file
        run: touch ./docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs
