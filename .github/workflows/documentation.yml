name: Documentation

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean docs directory
        run: rm -rf ./docs

      - name: Enable dev tooling
        run: touch .dev-tooling

      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target AstronomyKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path /AstronomyKit \
            --output-path ./docs

      - name: Create .nojekyll file
        run: touch ./docs/.nojekyll

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Scoped to the deploy job only: the build job above runs SwiftPM plugins
    # with read-only permissions and no persisted git credentials.
    permissions:
      contents: write
    steps:
      # github-pages-deploy-action runs git config/remote/worktree commands in
      # the workspace, so check out a shallow repo without persisted
      # credentials; the deploy action authenticates via its default github.token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download documentation artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: documentation
          path: docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs
          # Replace gh-pages with one commit on every deploy. SwiftPM clones
          # every branch, so a growing docs history would grow every
          # consumer's download.
          single-commit: true
