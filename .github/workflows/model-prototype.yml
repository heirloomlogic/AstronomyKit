name: Full model representation

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/model-prototype.yml"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "Tools/Migration/**"
      - "Scripts/generate-models.py"
      - "Scripts/migration/performance_baseline.py"
      - "Scripts/performance/polynomial/**"
      - "Scripts/model-prototype/**"
      - "Scripts/model-data/**"
      - "Documentation/Migration/performance-baseline.json"
      - "Documentation/Migration/ModelRepresentationProtocol.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  representation-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Install evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify complete generated data and protocol tests
        run: |
          python3 Scripts/generate-models.py --check-swift-prototype
          python3 -m unittest discover -s Scripts/model-prototype -p 'test_*.py' -v

      - name: Verify compiled prototype in Debug and Release
        shell: bash
        run: |
          mkdir -p .context/issue82/ci
          touch .model-prototype
          swift package purge-cache
          swift test --filter ModelDataTests 2>&1 | tee .context/issue82/ci/model-data-debug.log
          swift test -c release --filter ModelDataTests 2>&1 | tee .context/issue82/ci/model-data-release.log

      - name: Record same-environment C comparison baseline
        run: |
          mkdir -p .context/issue82/ci
          python3 - <<'PY' > .context/issue82/ci/baseline.log 2>&1
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("performance_baseline", "Scripts/migration/performance_baseline.py")
          baseline = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(baseline)
          record = baseline.measure()
          Path(".context/issue82/ci/comparison-baseline-linux.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Measure full representation and clean consumer
        run: |
          python3 Scripts/model-prototype/measure.py --measure --baseline .context/issue82/ci/comparison-baseline-linux.json --output .context/issue82/ci/representation-linux.json > .context/issue82/ci/representation.log 2>&1

      - name: Record hosted execution identity
        if: always()
        env:
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TESTED_SHA: ${{ github.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .context/issue82/ci
          python3 - <<'PYRECEIPT'
          import json
          import os
          from pathlib import Path
          keys = ("CI_RUN_URL", "CI_RUN_ATTEMPT", "CI_TESTED_SHA", "CI_HEAD_SHA")
          Path(".context/issue82/ci/hosted-execution.json").write_text(json.dumps({key: os.environ[key] for key in keys}, indent=2, sort_keys=True) + "\n")
          PYRECEIPT

      - name: Retain source-bound measurements and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-model-representation-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/issue82/ci/
          include-hidden-files: true
          if-no-files-found: error
